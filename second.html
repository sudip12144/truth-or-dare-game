<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Players Input Screen</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="first.css">
</head>
<body>

    <div class="container">
        <div class="screen active">
            <h1>Enter Player Names</h1>
            <p style="margin-bottom: 20px; color: #ccc; font-size: 0.95rem;">Please enter details for each player</p>
            
            <div id="players-container"></div>

            <p id="error-msg" style="color: #ff4d4d; font-size: 0.85rem; margin-top: 10px; display: none;"></p>

            <button class="btn" id="next-btn" style="margin-top: 15px;">Continue</button>
        </div>
    </div>

<script src="second.js"></script>
</body>
</html>
