<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truth or Dare Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="first.css">
</head>
<body>
    <div class="container">
        <div id="setup-screen" class="screen active">
            <h1>Truth or Dare</h1>
            <p style="margin-bottom: 20px; color: #ccc; font-size: 0.95rem;">How many player are play this game</p>
            
            <input type="text" id="player-name" placeholder="Enter Player Number...">

            <p id="error-msg" style="color: #ff4d4d; font-size: 0.85rem; margin-top: 8px; display: none;"></p>

            <button class="btn" id="start-btn">Start Game</button>
        </div>
    </div>
<script src="first.js"></script>
</body>
</html>
